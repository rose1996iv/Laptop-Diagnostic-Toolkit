[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laptop-diagnostic-toolkit"
version = "1.0.0"
description = "Offline-first Windows laptop diagnostic toolkit"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7", "psutil>=6.0,<8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
